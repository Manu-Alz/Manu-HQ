<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manu HQ</title>
  <meta name="description" content="Mi hub personal: entreno, judo, surf, proyectos, estudio e ideas." />
  <meta name="theme-color" content="#05060a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=12" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234d7cff'/><text x='50' y='68' font-family='Arial Black' font-size='48' font-weight='900' text-anchor='middle' fill='white'>HQ</text></svg>" />
</head>
<body>
  <!-- ============ Pantalla de entrada ============ -->
  <div id="splash">
    <div class="splash-glow"></div>
    <div class="splash-top">
      <span id="splash-clock">--:--</span>
      <span>Uruguay · 34°S</span>
    </div>

    <div class="splash-inner">
      <p class="eyebrow" id="splash-date"></p>
      <h1 class="splash-logo" aria-label="Manu HQ">
        <span class="l">M</span><span class="l">A</span><span class="l">N</span><span class="l">U</span><span class="l hq">H</span><span class="l hq">Q</span>
      </h1>
      <p class="splash-pillars">Judo <i></i> Fuerza <i></i> Surf <i></i> Proyectos <i></i> Vida</p>

      <div class="splash-today">
        <span class="label">Hoy toca</span>
        <span class="session" id="splash-session"></span>
        <span class="block" id="splash-block"></span>
      </div>

      <div class="cta-wrap">
        <button id="enter-btn" class="cta">
          <span class="cta-text">Arrancar el día</span>
          <span class="cta-icon"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>
        </button>
      </div>
      <p class="hint"><span class="desk"><kbd>Enter</kbd> para empezar</span><span class="touch">Tocá para empezar</span> · con música</p>
    </div>

    <figure class="splash-quote" id="splash-quote"></figure>

    <svg class="waves" viewBox="0 0 2880 160" preserveAspectRatio="none" aria-hidden="true">
      <path class="w1" d="M0 80 Q 180 30 360 80 T 720 80 T 1080 80 T 1440 80 T 1800 80 T 2160 80 T 2520 80 T 2880 80 V160 H0Z"/>
      <path class="w2" d="M0 100 Q 240 60 480 100 T 960 100 T 1440 100 T 1920 100 T 2400 100 T 2880 100 V160 H0Z"/>
      <path class="w3" d="M0 120 Q 120 100 240 120 T 480 120 T 720 120 T 960 120 T 1200 120 T 1440 120 T 1680 120 T 1920 120 T 2160 120 T 2400 120 T 2640 120 T 2880 120 V160 H0Z"/>
    </svg>
  </div>

  <!-- ============ App ============ -->
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#inicio">MANU<span>HQ</span></a>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-sm" id="export-btn">Exportar datos</button>
        <label class="btn btn-ghost btn-sm">Importar datos
          <input type="file" id="import-file" accept="application/json" hidden />
        </label>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn only-m" id="menu-btn" aria-label="Menú">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="brand only-m" href="#inicio">MANU<span>HQ</span></a>
        <form class="quick-idea" id="quick-idea" autocomplete="off">
          <span class="qi-icon" aria-hidden="true">💡</span>
          <input name="text" placeholder="Anotá una idea y Enter…" aria-label="Nueva idea" />
          <button class="qi-btn" aria-label="Guardar idea">Guardar</button>
        </form>
        <div class="topbar-right">
          <span id="top-sync"></span>
          <span class="top-date" id="top-date"></span>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <!-- ============ Reproductor (abajo, estilo Spotify) ============ -->
  <footer id="player" class="player">
    <div class="pl-tag">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span><b>Radio HQ</b><small>Mi playlist</small></span>
    </div>
    <div class="pl-embed-wrap"><div id="pl-embed"></div></div>
    <div class="pl-right">
      <a class="pl-open" href="https://open.spotify.com/playlist/1sBTc7WolPCShgS43THVEC" target="_blank" rel="noopener">Abrir en Spotify ↗</a>
      <button class="pl-btn" id="pl-min" title="Minimizar" aria-label="Minimizar reproductor"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
  </footer>
  <button id="pl-restore" class="pl-restore" aria-label="Mostrar reproductor">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span id="pl-restore-label">Música</span>
  </button>

  <script src="judo-data.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
